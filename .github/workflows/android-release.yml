name: Android Release Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --licenses
      - name: Prepare signing keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-upload-key.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secret found; building unsigned artifacts."
          fi
      - name: Build signed APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
      - name: Build unsigned APK and AAB
        if: steps.signing.outputs.enabled != 'true'
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kerlocker-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Kerlocker-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Clean signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-upload-key.jks"
